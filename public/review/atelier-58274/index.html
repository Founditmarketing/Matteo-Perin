<style>
:root {
  --cream:#F2EFE9; --sand:#E5E2DC; --black:#0A0A0A; --charcoal:#1C1C1C;

}
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--charcoal); font-family:'Playfair Display',Georgia,serif; -webkit-font-smoothing:antialiased; }
.eyebrow { font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.25em; text-transform:uppercase; font-weight:500; color:var(--orange-ink); }
.wrap { max-width:1040px; margin:0 auto; padding:0 24px; }
img { max-width:100%; display:block; }

header.page { padding:56px 0 40px; }
.topline { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.lang { font-family:'Montserrat',system-ui,sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
.lang button { background:none; border:none; cursor:pointer; font:inherit; color:var(--stone-ink); padding:6px 4px; }
.lang button.on { color:var(--orange-ink); font-weight:500; border-bottom:1px solid var(--orange); }
h1 { font-weight:400; font-size:clamp(34px,6vw,58px); line-height:1.08; margin:16px 0 20px; }
.steps-line { font-family:'Montserrat',system-ui,sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--orange-ink); margin:0 0 18px; }
.lede { font-style:italic; font-size:17px; line-height:1.65; color:var(--stone-ink); max-width:36em; margin:0; }

.untouched { border-top:1px solid rgba(28,28,28,.12); border-bottom:1px solid rgba(28,28,28,.12); padding:34px 0 30px; margin:44px 0 0; }
.untouched .eyebrow { color:var(--stone-ink); display:block; margin-bottom:16px; }
.untouched ul { list-style:none; margin:0; padding:0; max-width:44em; }
.untouched li { font-style:italic; font-size:15.5px; line-height:1.6; color:var(--charcoal); padding:7px 0 7px 26px; position:relative; }
.untouched li::before { content:""; position:absolute; left:0; top:17px; width:14px; height:1px; background:var(--orange); }

section.proposal { padding:72px 0 56px; border-bottom:1px solid rgba(28,28,28,.1); }
.p-head { display:flex; align-items:baseline; gap:16px; margin-bottom:8px; }
.p-num { font-size:22px; color:var(--orange); }
h2 { font-weight:400; font-size:clamp(26px,4vw,38px); margin:6px 0 10px; }
.p-what { font-style:italic; font-size:15px; line-height:1.6; color:var(--stone-ink); max-width:40em; margin:0 0 30px; }

.today { display:grid; gap:10px; margin:0 0 14px; }
@media (min-width:760px) { .today { grid-template-columns:minmax(0,420px) 1fr; gap:28px; align-items:center; } }
.today .shot { border:1px solid rgba(28,28,28,.18); }
.today .t-label { font-family:'Montserrat',system-ui,sans-serif; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--stone-ink); margin-bottom:8px; }
.today .t-note { font-style:italic; font-size:14px; line-height:1.6; color:var(--stone-ink); max-width:24em; }
.arrow { text-align:center; color:var(--orange); font-size:22px; line-height:1; margin:18px 0; }

.mock { background:var(--sand); padding:28px; }
@media (min-width:720px) { .mock { padding:44px; } }
.mock-label { font-family:'Montserrat',system-ui,sans-serif; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--stone-ink); margin-bottom:20px; }
.cap { font-style:italic; font-size:13px; line-height:1.55; color:var(--stone-ink); margin-top:10px; }
.receipt { font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--stone-ink); margin-top:22px; }
.arr { margin-bottom:44px; }
.arr:last-child { margin-bottom:0; }
.arr h3 { font-weight:400; font-style:italic; font-size:21px; margin:0 0 14px; }
.frame { background:#fff; overflow:hidden; }
.frame img { width:100%; height:100%; object-fit:cover; }
.statement .frame { max-width:520px; margin:0 auto; aspect-ratio:2/3; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (min-width:720px) { .pair { gap:24px; } }
.pair .frame { aspect-ratio:2/3; }
.pair .offset { margin-top:36px; }

.dark { background:var(--black); color:#fff; padding:28px; }
@media (min-width:720px) { .dark { padding:44px; } }
.dark .mock-label { color:rgba(255,255,255,.5); }
.dark .cap { color:rgba(255,255,255,.55); }
.croc-hero { max-width:560px; margin:0 auto 24px; }
.croc-hero .frame { aspect-ratio:4/5; background:#111; }
.croc-pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:720px; margin:0 auto; }
@media (min-width:720px) { .croc-pair { gap:24px; } }
.croc-pair .frame { aspect-ratio:1/1; background:#111; }
.steps { display:flex; justify-content:center; gap:28px; margin-bottom:28px; flex-wrap:wrap; }
.steps span { font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.65); }
.madein { text-align:center; margin:30px 0 0; font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.28em; text-transform:uppercase; font-weight:500; color:var(--orange); }

.human .frame.a { aspect-ratio:4/3; }
.human .frame.b { aspect-ratio:4/5; max-width:340px; }
.human-copy { margin-top:22px; max-width:34em; }
.human-copy p { font-size:17px; line-height:1.65; margin:0 0 8px; }

.board { background:#fff; max-width:460px; padding:26px 26px 20px; }
.board .bar { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(28,28,28,.1); padding-bottom:14px; margin-bottom:16px; }
.board .bar b { font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:500; }
.board .bar i { font-style:normal; color:var(--orange-ink); font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.22em; }
.row { display:flex; gap:14px; align-items:center; padding:10px 0; }
.row .th { width:52px; height:66px; background:var(--sand); flex:none; overflow:hidden; }
.row .th img { width:100%; height:100%; object-fit:cover; display:block; }
.row div p { margin:0; font-size:15px; }
.row div p:last-child { font-family:'Montserrat',system-ui,sans-serif; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--stone-ink); margin-top:3px; }
.board .send { margin-top:16px; font-family:'Montserrat',system-ui,sans-serif; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--charcoal); border-bottom:1px solid var(--orange); display:inline-block; padding-bottom:3px; }

.cards { display:grid; gap:20px; }
@media (min-width:720px) { .cards { grid-template-columns:1fr 1fr; align-items:start; gap:28px; } }
.card { background:#fff; padding:26px; }
.card .c-label { font-family:'Montserrat',system-ui,sans-serif; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--stone-ink); margin-bottom:16px; }
.spec { border-top:1px solid rgba(28,28,28,.1); }
.spec div { display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid rgba(28,28,28,.1); }
.spec span:first-child { font-family:'Montserrat',system-ui,sans-serif; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--stone-ink); }
.spec span:last-child { font-size:15px; text-align:right; }
.spec .hl span { color:var(--orange-ink); }
.spec .hl span:last-child { font-style:italic; }
.homeline { text-align:center; padding:26px 0 10px; }
.homeline .eyebrow { display:block; margin-bottom:10px; color:var(--orange-ink); }
.homeline p { font-size:20px; font-style:italic; margin:0; }

.verdict { margin-top:32px; display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.v-btn { font-family:'Montserrat',system-ui,sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:500; padding:14px 26px; cursor:pointer; border:1px solid var(--charcoal); background:transparent; color:var(--charcoal); transition:all .2s; min-height:44px; }
.v-btn.approve.sel { background:var(--orange-ink); border-color:var(--orange-ink); color:#fff; }
.v-btn.decline.sel { background:var(--charcoal); color:#fff; }
.v-note { flex:1 1 220px; min-height:44px; padding:12px 14px; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:14px; border:1px solid rgba(28,28,28,.25); background:#fff; color:var(--charcoal); }
.v-note::placeholder { color:var(--stone); }

.sendbar { position:sticky; bottom:0; background:var(--black); padding:16px 0; z-index:50; }
.sendbar .wrap { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.sendbar p { color:rgba(255,255,255,.65); font-style:italic; font-size:14px; margin:0; }
.sendbar .actions { display:flex; gap:10px; flex-wrap:wrap; }
.sendbar a, .sendbar button.copy { font-family:'Montserrat',system-ui,sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:500; padding:14px 22px; text-decoration:none; display:inline-block; cursor:pointer; }
.sendbar a { color:#fff; background:var(--orange-ink); border:1px solid var(--orange-ink); }
.sendbar button.copy { color:rgba(255,255,255,.85); background:transparent; border:1px solid rgba(255,255,255,.35); }

footer.page { padding:48px 0 72px; }
footer.page p { font-style:italic; font-size:13px; color:var(--stone-ink); max-width:38em; line-height:1.6; }
</style>
</head>

  var lang = 'it';
  try { lang = localStorage.getItem('mp-lang') || 'it'; } catch (e) {}
  if (lang !== 'it' && lang !== 'en') lang = 'it';

  var sections = Array.prototype.slice.call(document.querySelectorAll('section.proposal'));
  var state = {};
  try { state = JSON.parse(localStorage.getItem('mp-verdicts') || '{}'); } catch (e) { state = {}; }

  function save() { try { localStorage.setItem('mp-verdicts', JSON.stringify(state)); } catch (e) {} }

  function applyLang() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.docTitle;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var key = el.getAttribute('data-t');
      if (!(key in t)) return;
      if (key === 'h1') { el.innerHTML = t[key].replace('\n', '<br>'); }
      else { el.textContent = t[key]; }
    });
    document.querySelectorAll('.v-note').forEach(function (n) { n.placeholder = t.notePh; });
    document.getElementById('lang-it').classList.toggle('on', lang === 'it');
    document.getElementById('lang-en').classList.toggle('on', lang === 'en');
    render();
  }

  function answersText() {
    var t = T[lang];
    var lines = sections.map(function (s) {
      var id = s.getAttribute('data-id');
      var v = state[id] || {};
      var mark = v.verdict === 'approve' ? t.markA : v.verdict === 'decline' ? t.markD : t.markN;
      return '- ' + t.titles[id] + ': ' + mark + (v.note ? ' — "' + v.note + '"' : '');
    });
    return t.mailHead + '\n\n' + lines.join('\n') + '\n\n— Matteo';
  }

  function render() {
    var t = T[lang];
    var done = 0;
    sections.forEach(function (s) {
      var id = s.getAttribute('data-id');
      var v = state[id] || {};
      s.querySelector('.approve').classList.toggle('sel', v.verdict === 'approve');
      s.querySelector('.decline').classList.toggle('sel', v.verdict === 'decline');
      if (v.verdict) done++;
    });
    var tally = document.getElementById('tally');
    var send = document.getElementById('send');
    var copy = document.getElementById('copybtn');
    if (done === 0) {
      tally.textContent = t.tallyEmpty;
      send.style.display = 'none';
      copy.style.display = 'none';
    } else {
      tally.textContent = t.tallyCount.replace('{n}', done);
      send.style.display = 'inline-block';
      send.textContent = t.sendBtn;
      copy.style.display = 'inline-block';
      copy.textContent = t.copyBtn;
      send.href = 'mailto:trevorruby@gmail.com?subject=' + encodeURIComponent(t.mailSubject) + '&body=' + encodeURIComponent(answersText());
    }
  }

  sections.forEach(function (s) {
    var id = s.getAttribute('data-id');
    var note = s.querySelector('.v-note');
    if (state[id] && state[id].note) note.value = state[id].note;
    s.querySelector('.approve').addEventListener('click', function () {
      state[id] = state[id] || {};
      state[id].verdict = state[id].verdict === 'approve' ? null : 'approve';
      save(); render();
    });
    s.querySelector('.decline').addEventListener('click', function () {
      state[id] = state[id] || {};
      state[id].verdict = state[id].verdict === 'decline' ? null : 'decline';
      save(); render();
    });
    note.addEventListener('input', function () {
      state[id] = state[id] || {};
      state[id].note = note.value.trim();
      save(); render();
    });
  });

  document.getElementById('lang-it').addEventListener('click', function () {
    lang = 'it'; try { localStorage.setItem('mp-lang', 'it'); } catch (e) {} applyLang();
  });
  document.getElementById('lang-en').addEventListener('click', function () {
    lang = 'en'; try { localStorage.setItem('mp-lang', 'en'); } catch (e) {} applyLang();
  });

  // Copy fallback for phones with no configured mail app.
  document.getElementById('copybtn').addEventListener('click', function () {
    var t = T[lang];
    var text = answersText();
    var btn = this;
    function ok() { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copyBtn; }, 2200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  applyLang();
})();
