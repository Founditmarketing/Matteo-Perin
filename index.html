  <!-- Lenis Smooth Scrolling (deferred — not render-blocking) -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof Lenis === 'undefined') return;
      // Respect reduced-motion: native scrolling, no smoothing layer
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        direction: 'vertical',
        gestureDirection: 'vertical',
        smooth: !isTouch,
        mouseMultiplier: 1.0,
        smoothTouch: false,
        touchMultiplier: 2,
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
      window.lenis = lenis;
    });
  </script>

          '<strong>Stack:</strong> ' + (error ? error.stack : 'N/A');
        document.body.appendChild(errorContainer);
      };
    }
