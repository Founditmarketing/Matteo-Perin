  <!-- Google Ads: Email Inquiry Click conversion -->
  <script>
    function gtag_report_conversion(url) {

      gtag('event', 'conversion', {

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Lenis Smooth Scrolling (deferred — not render-blocking) -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof Lenis === 'undefined') return;
      const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        direction: 'vertical',
        gestureDirection: 'vertical',
        smooth: !isTouch,
        mouseMultiplier: 1.0,
        smoothTouch: false,
        touchMultiplier: 2,
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
      window.lenis = lenis;
    });
  </script>

  <!-- CRITICAL DEBUGGING: Global Error Handler -->
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const errorContainer = document.createElement('div');
      errorContainer.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:99999; padding:20px; color:red; font-family:monospace; white-space:pre-wrap; overflow:auto;';
      errorContainer.innerHTML = '<h1>CRITICAL STARTUP ERROR</h1>' +
        '<strong>Message:</strong> ' + message + '\n' +
        '<strong>Source:</strong> ' + source + ':' + lineno + '\n' +
        '<strong>Stack:</strong> ' + (error ? error.stack : 'N/A');
      document.body.appendChild(errorContainer);
    };
  </script>

  <script>
    window.onload = function() {
      document.body.classList.remove('invisible');
    };
  </script>
